# Bunderhost's deployment contract for the site (agentic-design.kcrz.dev). The site is
# static: Dockerfile.bunderhost at the repository root builds the viewer and the pages and
# serves them with Caddy on :3000. It declares no tables, jobs or variables; Bunderhost's
# contract still asks for a database and a bucket section, which the site leaves unused.
version: 1
generator:
  name: bunderstack
  version: 0.24.0
application:
  framework: custom
  scripts:
    build: build
    start: start
bunderstack:
  entry: build.mjs
  manifestVersion: 4
resources:
  database:
    dialect: sqlite
    migrationsDirectory: migrations
    migrationMode: migrations
    tables: []
  storage:
    defaultBucket: files
    buckets:
      - name: files
        visibility: private
  messaging:
    channels: []
environment: []
background:
  worker:
    required: false
  jobs: []
  cron: []
  maintenance: []
