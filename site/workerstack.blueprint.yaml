version: 2
generator:
  name: workerstack
  version: 0.3.0
application:
  framework: bun-ssr
  scripts:
    build: build
  worker:
    render: ssr
    main: src/server.ts
    compatibilityDate: 2026-11-02
    assets: dist/client
    durableObjects:
      - binding: DOC_ROOM
        className: DocRoom
authentication:
  managedIdentity:
    protocolVersion: 2
    adapterVersion: 2
    discovery: true
    callbackPath: /api/auth/callback/bunderhost
workerstack:
  entry: src/workerstack.ts
  manifestVersion: 4
resources:
  database:
    dialect: sqlite
    migrationsDirectory: ./migrations
    migrationMode: migrations
    tables:
      - exportName: _system.idempotency
        physicalName: _bunderstack_idempotency
        system: true
      - exportName: _system.jobs
        physicalName: _bunderstack_jobs
        system: true
      - exportName: _system.messageEvents
        physicalName: _bunderstack_message_events
        system: true
      - exportName: _system.messages
        physicalName: _bunderstack_messages
        system: true
      - exportName: account
        physicalName: account
        system: false
      - exportName: accountDeletion
        physicalName: account_deletion
        system: false
      - exportName: appAuthCode
        physicalName: app_auth_code
        system: false
      - exportName: asset
        physicalName: asset
        system: false
      - exportName: authTrace
        physicalName: auth_trace
        system: false
      - exportName: _system.files
        physicalName: bunderstack_file_meta
        system: true
      - exportName: document
        physicalName: document
        system: false
      - exportName: invitation
        physicalName: invitation
        system: false
      - exportName: member
        physicalName: member
        system: false
      - exportName: organization
        physicalName: organization
        system: false
      - exportName: session
        physicalName: session
        system: false
      - exportName: shareLink
        physicalName: share_link
        system: false
      - exportName: user
        physicalName: user
        system: false
      - exportName: verification
        physicalName: verification
        system: false
      - exportName: version
        physicalName: version
        system: false
      - exportName: viewMetric
        physicalName: view_metric
        system: false
      - exportName: workspacePlan
        physicalName: workspace_plan
        system: false
  storage:
    defaultBucket: default
    buckets:
      - name: default
        visibility: private
  messaging:
    channels: []
environment:
  - key: BUNDERHOST_AUTH_CONFIG
    required: false
    scope: server
    sensitive: true
api:
  operations:
    - handle: appToken
      operationId: appToken
      effect: mutation
      method: POST
      path: /api/app-auth/token
    - handle: commitVersion
      operationId: commitVersion
      effect: mutation
      method: POST
      path: /api/docs/{docId}/versions/{versionId}/commit
    - handle: createFile
      operationId: createFile
      effect: mutation
      method: POST
      path: /api/docs
    - handle: createLink
      operationId: createLink
      effect: mutation
      method: POST
      path: /api/docs/{docId}/links
    - handle: deleteAccount
      operationId: deleteAccount
      effect: mutation
      method: POST
      path: /api/account/delete
    - handle: deleteFile
      operationId: deleteFile
      effect: mutation
      method: DELETE
      path: /api/docs/{docId}
    - handle: getFile
      operationId: getFile
      effect: read
      method: GET
      path: /api/docs/{docId}
    - handle: listFiles
      operationId: listFiles
      effect: read
      method: GET
      path: /api/docs
    - handle: me
      operationId: me
      effect: read
      method: GET
      path: /api/me
    - handle: newVersion
      operationId: newVersion
      effect: mutation
      method: POST
      path: /api/docs/{docId}/versions
    - handle: oembed
      operationId: oembed
      effect: read
      method: GET
      path: /api/oembed
    - handle: onboardingDone
      operationId: onboardingDone
      effect: mutation
      method: POST
      path: /api/me/onboarding
    - handle: renameFile
      operationId: renameFile
      effect: mutation
      method: PATCH
      path: /api/docs/{docId}
    - handle: revokeLink
      operationId: revokeLink
      effect: mutation
      method: DELETE
      path: /api/links/{linkId}
    - handle: share
      operationId: share
      effect: read
      method: GET
      path: /api/share/{token}
    - handle: updateLink
      operationId: updateLink
      effect: mutation
      method: PATCH
      path: /api/links/{linkId}
    - handle: version
      operationId: version
      effect: read
      method: GET
      path: /api/version
    - handle: viewMetric
      operationId: viewMetric
      effect: mutation
      method: POST
      path: /api/metrics/view
background:
  jobs: []
  cron:
    - name: accountDeletions
      schedule: "15 * * * *"
      timezone: UTC
    - name: cleanup
      schedule: "30 3 * * *"
      timezone: UTC
  maintenance:
    - name: storage-sweep
      schedule: "0 4 * * *"
      timezone: UTC
