version: 2
generator:
  name: workerstack
  version: 0.2.4
application:
  framework: bun-ssr
  scripts:
    build: build
  worker:
    render: ssr
    main: src/server.ts
    compatibilityDate: 2026-11-02
    assets: dist/client
workerstack:
  entry: src/workerstack.ts
  manifestVersion: 4
resources:
  database:
    dialect: sqlite
    migrationsDirectory: ./migrations
    migrationMode: migrations
    tables:
      - exportName: _system.idempotency
        physicalName: _bunderstack_idempotency
        system: true
      - exportName: _system.jobs
        physicalName: _bunderstack_jobs
        system: true
      - exportName: _system.messageEvents
        physicalName: _bunderstack_message_events
        system: true
      - exportName: _system.messages
        physicalName: _bunderstack_messages
        system: true
      - exportName: _system.files
        physicalName: bunderstack_file_meta
        system: true
  storage:
    defaultBucket: default
    buckets:
      - name: default
        visibility: private
  messaging:
    channels: []
environment: []
api:
  operations:
    - handle: version
      operationId: version
      effect: read
      method: GET
      path: /api/version
background:
  jobs: []
  cron: []
  maintenance:
    - name: storage-sweep
      schedule: "0 4 * * *"
      timezone: UTC
