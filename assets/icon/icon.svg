<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Agentic Design app icon: the landing page's logo mark (a pointer on the clay accent)
       over an artboard. macOS icon grid: an 824 px rounded square with a soft shadow.
       Rendered by tools/release/make_icon.sh into AppIcon.icns. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5876A"/>
      <stop offset="1" stop-color="#C8643F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5A2414" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- artboard -->
  <g filter="url(#soft)">
    <rect x="232" y="268" width="500" height="380" rx="28" fill="#FAFAF7"/>
  </g>
  <rect x="276" y="318" width="190" height="26" rx="13" fill="#C8643F"/>
  <rect x="276" y="372" width="400" height="34" rx="12" fill="#1C1B19"/>
  <rect x="276" y="424" width="300" height="34" rx="12" fill="#1C1B19"/>
  <rect x="276" y="490" width="360" height="14" rx="7" fill="#E4E2DA"/>
  <rect x="276" y="520" width="300" height="14" rx="7" fill="#E4E2DA"/>
  <rect x="276" y="566" width="130" height="44" rx="12" fill="#C8643F"/>
  <!-- the agent's pointer (the logo's path, M2 1 L17 8.5 L10.2 10.6 L7.4 17.5 Z) -->
  <g filter="url(#soft)">
    <g transform="translate(560 520) scale(17)">
      <path d="M2 1 L17 8.5 L10.2 10.6 L7.4 17.5 Z" fill="#FFFFFF" stroke="#1C1B19" stroke-width="0.9" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
