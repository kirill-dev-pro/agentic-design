<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Agentic Design viewer</title>
<style>
	:root { color-scheme: dark; }
	html, body { margin: 0; height: 100%; background: #1e1e1e; color: #e6e6e6; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
	#bar { position: fixed; inset: 0 0 auto 0; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #1e1e1e; border-bottom: 1px solid #2c2c2c; box-sizing: border-box; }
	#title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#bar .spacer { flex: 1; }
	#bar select, #bar button, #bar label.button { background: #2a2a2a; color: inherit; border: 1px solid #3a3a3a; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
	#bar select:hover, #bar button:hover, #bar label.button:hover { background: #333; }
	#missing { color: #e0a85a; display: none; }
	#canvas { position: fixed; inset: 40px 0 0 0; width: 100%; height: calc(100% - 40px); display: block; touch-action: none; cursor: grab; }
	#canvas.dragging { cursor: grabbing; }
	#message { position: fixed; inset: 40px 0 0 0; display: flex; align-items: center; justify-content: center; text-align: center; color: #9a9a9a; pointer-events: none; padding: 24px; line-height: 1.6; }
	#message.error { color: #e57373; }
	body.drop #canvas { outline: 2px dashed #6e56cf; outline-offset: -8px; }
</style>
</head>
<body>
<div id="bar">
	<span id="title">Agentic Design viewer</span>
	<select id="pages" hidden></select>
	<span class="spacer"></span>
	<span id="missing"></span>
	<button id="zoom" title="Zoom to fit (0)">100%</button>
	<label class="button" title="Open a .pen file with its images, fonts and libraries">Open folder<input id="open-dir" type="file" webkitdirectory hidden></label>
	<label class="button" title="Open .pen files and the files they use">Open files<input id="open-files" type="file" multiple hidden></label>
</div>
<canvas id="canvas"></canvas>
<div id="message">Drop a .pen file, or the folder it is in, here.<br>Or open one by URL: <code>?file=/path/to/design.pen</code></div>
<script src="odin.js"></script>
<script src="wgpu.js"></script>
<script src="viewer.js"></script>
</body>
</html>
