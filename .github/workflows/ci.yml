# Builds what a change could break without anyone noticing: the browser viewer (the engine
# for js_wasm32). The macOS app is built and checked by release.yml on tags.
#
# On a push it also uploads the compiled viewer and editor (viewer.wasm, odin.js, edit/editor.wasm)
# to the web-viewer-builds prerelease, named by a hash of its sources (site/scripts/viewer-key.mjs) with a .sha256 next
# to it. The website build (Bunderhost, site/scripts/viewer.sh) fetches it from there rather than
# downloading Odin and lld itself. A key that is there already is kept, not uploaded again.
name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the upload to the web-viewer-builds prerelease
    env:
      # the same Odin release as release.yml and site/scripts/viewer.sh, for Linux
      ODIN_VERSION: dev-2026-10
      ODIN_SHA256: c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab
    steps:
      - uses: actions/checkout@v5

      - name: Odin (pinned release) and wasm-ld
        run: |
          curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz"
          echo "$ODIN_SHA256  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/odin"
          tar xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lld
          command -v wasm-ld || echo "$(dirname "$(ls /usr/lib/llvm-*/bin/wasm-ld | head -n 1)")" >> "$GITHUB_PATH"

      - name: Viewer (WebAssembly)
        run: |
          odin version
          sh tools/build_web.sh
          ls -l build/web/viewer.wasm build/web/edit/editor.wasm

      - name: Upload for the website build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: web-viewer-builds
        run: |
          KEY=$(node site/scripts/viewer-key.mjs)
          NAME="viewer-$KEY.tar.gz"
          echo "key $KEY"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Viewer builds for the website" \
              --notes "The browser viewer compiled by CI for each set of sources, which the website build fetches (site/scripts/viewer.sh). Not a release of the app." \
              || gh release view "$TAG" >/dev/null
          fi
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$NAME.sha256"; then
            echo "$NAME is there already"
            exit 0
          fi
          cd "$RUNNER_TEMP"
          tar czf "$NAME" -C "$GITHUB_WORKSPACE/build/web" viewer.wasm odin.js edit/editor.wasm
          sha256sum "$NAME" > "$NAME.sha256"
          # the .sha256 goes up last and only after this run's archive: the site build takes it
          # as the sign that the archive is complete
          # --clobber: an archive without its .sha256 is from a run that was cancelled between the
          # two uploads (or one still uploading); this run's copy of the same sources replaces it
          gh release upload "$TAG" "$NAME" --clobber
          gh release upload "$TAG" "$NAME.sha256" --clobber
          # keep the newest 30 builds (two files each, about 3 MB a build)
          gh release view "$TAG" --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[60:] | .[].name' \
            | xargs -r -n 1 gh release delete-asset "$TAG" -y
