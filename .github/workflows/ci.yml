# Builds what a change could break without anyone noticing: the browser viewer (the engine
# for js_wasm32), and the desktop app for Linux and Windows (each uploaded as an artifact of
# the run). The macOS app is built and checked by release.yml on tags.
#
# On a push it also uploads the compiled viewer, editor and server engine (viewer.wasm, odin.js,
# edit/editor.wasm, pencore/pencore.wasm) to the web-viewer-builds prerelease, named by a hash of its sources (site/scripts/viewer-key.mjs) with a .sha256 next
# to it. The website build (Bunderhost, site/scripts/viewer.sh) fetches it from there rather than
# downloading Odin and lld itself. A key that is there already is kept, not uploaded again.
name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the upload to the web-viewer-builds prerelease
    env:
      # the same Odin release as release.yml and site/scripts/viewer.sh, for Linux
      ODIN_VERSION: dev-2026-10
      ODIN_SHA256: c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab
    steps:
      - uses: actions/checkout@v5

      - name: Odin (pinned release) and wasm-ld
        run: |
          curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz"
          echo "$ODIN_SHA256  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/odin"
          tar xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lld
          command -v wasm-ld || echo "$(dirname "$(ls /usr/lib/llvm-*/bin/wasm-ld | head -n 1)")" >> "$GITHUB_PATH"

      - name: Viewer (WebAssembly)
        run: |
          odin version
          sh tools/build_web.sh
          sh tools/build_pencore.sh
          ls -l build/web/viewer.wasm build/web/edit/editor.wasm build/pencore/pencore.wasm

      - name: Upload for the website build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: web-viewer-builds
        run: |
          KEY=$(node site/scripts/viewer-key.mjs)
          NAME="viewer-$KEY.tar.gz"
          echo "key $KEY"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Viewer builds for the website" \
              --notes "The browser viewer compiled by CI for each set of sources, which the website build fetches (site/scripts/viewer.sh). Not a release of the app." \
              || gh release view "$TAG" >/dev/null
          fi
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$NAME.sha256"; then
            echo "$NAME is there already"
            exit 0
          fi
          cd "$RUNNER_TEMP"
          tar czf "$NAME" -C "$GITHUB_WORKSPACE/build/web" viewer.wasm odin.js edit/editor.wasm -C "$GITHUB_WORKSPACE/build" pencore/pencore.wasm
          sha256sum "$NAME" > "$NAME.sha256"
          # the .sha256 goes up last and only after this run's archive: the site build takes it
          # as the sign that the archive is complete
          # --clobber: an archive without its .sha256 is from a run that was cancelled between the
          # two uploads (or one still uploading); this run's copy of the same sources replaces it
          gh release upload "$TAG" "$NAME" --clobber
          gh release upload "$TAG" "$NAME.sha256" --clobber
          # keep the newest 30 builds (two files each, about 3 MB a build)
          gh release view "$TAG" --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[60:] | .[].name' \
            | xargs -r -n 1 gh release delete-asset "$TAG" -y

  # The desktop app on Linux (x86-64): WebGPU through Vulkan, GLFW from the system (X11, or
  # XWayland). The artifact needs libglfw3 installed where it runs.
  linux:
    runs-on: ubuntu-24.04
    env:
      ODIN_VERSION: dev-2026-10
      ODIN_SHA256: c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab
    steps:
      - uses: actions/checkout@v5

      - name: Odin (pinned release), its stb libraries, GLFW and zlib
        run: |
          curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz"
          echo "$ODIN_SHA256  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/odin"
          tar xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
          (cd "$RUNNER_TEMP/odin/vendor/stb/src" && sh build_stb.sh unix)
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libglfw3-dev zlib1g-dev

      - name: Build, check and pack
        run: tools/release/desktop.sh

      - uses: actions/upload-artifact@v5
        with:
          name: agentic-design-linux-x86_64
          path: dist/Agentic-Design-*-linux-x86_64.tar.gz
          retention-days: 14

  # The desktop app on Windows (x86-64): WebGPU through Direct3D 12, linked with MSVC.
  windows:
    runs-on: windows-2025
    env:
      ODIN_VERSION: dev-2026-10
      ODIN_SHA256: b6b2e426a8b6f147b74ec7e18bef8df27cf40fe16193159df7ca09a0cc0c2011
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Odin (pinned release; the stb and GLFW libraries come with it)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/odin.zip" "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-windows-amd64-$ODIN_VERSION.zip"
          echo "$ODIN_SHA256  $RUNNER_TEMP/odin.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/odin.zip" -d "$RUNNER_TEMP/odin"
          echo "$RUNNER_TEMP/odin/dist" >> "$GITHUB_PATH"

      - name: Build, check and pack
        run: tools/release/desktop.sh

      - uses: actions/upload-artifact@v5
        with:
          name: agentic-design-windows-x86_64
          path: dist/Agentic-Design-*-windows-x86_64.zip
          retention-days: 14
