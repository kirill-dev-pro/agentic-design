# Builds the website (site/) with the browser viewer and publishes it on GitHub Pages at
# agentic-design.kcrz.dev (site/README.md). Runs on pushes to main that touch the site, the
# viewer or what the viewer is built from, and by hand.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - "src/web/**"
      - "src/engine/**"
      - "src/nanovg/**"
      - "src/fontstash/**"
      - "src/wgpu/**"
      - "assets/**"
      - "designs/sample/**"
      - "tools/build_web.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # the same Odin release as release.yml, for Linux
      ODIN_VERSION: dev-2026-10
      ODIN_SHA256: c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab
    steps:
      - uses: actions/checkout@v5

      - name: Odin (pinned release) and wasm-ld
        run: |
          curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz"
          echo "$ODIN_SHA256  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/odin"
          tar xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lld
          command -v wasm-ld || echo "$(dirname "$(ls /usr/lib/llvm-*/bin/wasm-ld | head -n 1)")" >> "$GITHUB_PATH"

      - name: Viewer (WebAssembly)
        run: |
          odin version
          sh tools/build_web.sh
          ls -l build/web/viewer.wasm
          echo "viewer.wasm gzip: $(gzip -9 -c build/web/viewer.wasm | wc -c) bytes"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Site
        run: node site/build.mjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
