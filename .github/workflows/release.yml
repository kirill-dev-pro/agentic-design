# Builds, signs and publishes a release when a tag v<version> is pushed (docs/releasing.md).
#
# Secrets:
#   UPDATE_SIGNING_KEY          required. Base64 Ed25519 seed that signs latest.json; its
#                               public key is UPDATE_PUBLIC_KEY in src/update.odin.
#   DEVELOPER_ID_P12            optional. Base64 "Developer ID Application" certificate +
#   DEVELOPER_ID_P12_PASSWORD   key (.p12) and its password. Without them the app is
#                               signed ad hoc.
#   APPLE_ID, APPLE_TEAM_ID,    optional, with the certificate. Notarization: the Apple ID,
#   APPLE_APP_PASSWORD          team and an app-specific password.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15 # Apple Silicon
    env:
      ODIN_VERSION: dev-2026-10
      ODIN_SHA256: b276c6ac87c3eea17446a6ca9080089b6e9f492057fb773591775ee49d92a1cf
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Odin (pinned release, not Homebrew's)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-macos-arm64-$ODIN_VERSION.tar.gz"
          echo "$ODIN_SHA256  $RUNNER_TEMP/odin.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/odin"
          tar xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "ODIN=$RUNNER_TEMP/odin/odin" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/odin/odin" version

      - name: The tag matches src/version.odin
        run: |
          VERSION=$(sed -n 's/^VERSION :: #config(VERSION, "\(.*\)")$/\1/p' src/version.odin)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $VERSION in src/version.odin"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ ! -f "$NOTES" ]; then echo "::error::missing $NOTES"; exit 1; fi
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Developer ID certificate into a temporary keychain
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD=$(openssl rand -hex 24)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/devid.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$ID" ]; then echo "::error::no Developer ID Application identity in the certificate"; exit 1; fi
          echo "DEVELOPER_ID=$ID" >> "$GITHUB_ENV"

      - name: Build, bundle and sign
        env:
          UPDATE_FEED: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: tools/release/build.sh

      - name: Notarize and staple
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ZIP="dist/Agentic-Design-$VERSION-arm64.zip"
          xcrun notarytool submit "$ZIP" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/Agentic Design.app"
          PACK_ONLY=1 tools/release/bundle.sh build/release/agentic-design dist
          DMG="dist/Agentic-Design-$VERSION-arm64.dmg"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - name: Update manifest (signed)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "::error::the UPDATE_SIGNING_KEY secret is not set"; exit 1; fi
          "$ODIN" build tools/release/updatesign -out:build/updatesign -o:speed
          ZIP_NAME="Agentic-Design-$VERSION-arm64.zip"
          URL="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$ZIP_NAME"
          build/updatesign manifest "$VERSION" "$URL" "dist/$ZIP_NAME" "$NOTES" dist/latest.json
          build/updatesign sign dist/latest.json
          # the app's own public key must accept it
          PUB=$(sed -n 's/^UPDATE_PUBLIC_KEY :: "\(.*\)"$/\1/p' src/update.odin)
          build/updatesign verify "$PUB" dist/latest.json
          (cd dist && shasum -a 256 *.zip *.dmg > SHA256SUMS)

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Agentic-Design-$VERSION-arm64.dmg" \
            "dist/Agentic-Design-$VERSION-arm64.zip" \
            dist/latest.json dist/latest.json.sig dist/SHA256SUMS \
            --title "Agentic Design $VERSION" --notes-file "$NOTES"
